<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EasyTools</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
}

header {
  background: #2563eb;
  color: white;
  text-align: center;
  padding: 30px 15px;
  <nav style="background:#1e40af;padding:12px;text-align:center;">
<a href="#tools" style="color:white;margin:0 10px;text-decoration:none;">Home</a>
<a href="#about" style="color:white;margin:0 10px;text-decoration:none;">About</a>
<a href="#contact" style="color:white;margin:0 10px;text-decoration:none;">Contact</a>
<a href="#privacy" style="color:white;margin:0 10px;text-decoration:none;">Privacy</a>
</nav>
}

header h1 {
  margin: 0;
  font-size: 36px;
}

.container {
  max-width: 900px;
  margin: 25px auto;
  padding: 15px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 20px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.1);
}

input {
  width: 100%;
  padding: 12px;
  margin: 6px 0;
  box-sizing: border-box;
  border: 1px solid #ccc;
  border-radius: 7px;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 8px;
  background: #2563eb;
  color: white;
  border: none;
  border-radius: 7px;
  font-size: 16px;
}

.result {
  margin-top: 12px;
  font-weight: bold;
  color: #2563eb;
}

footer {
  text-align: center;
  padding: 30px;
  color: #666;
}
</style>
</head>

<body>

<header>
<h1>EasyTools</h1>
<p>Free Online Tools</p>
</header>

<div class="container">

<div class="grid">

<!-- AGE -->
<div class="card">
<h2>🎂 Age Calculator</h2>

<input type="date" id="birth">

<button id="ageBtn">Calculate Age</button>

<div class="result" id="ageResult"></div>
</div>


<!-- PERCENTAGE -->
<div class="card">
<h2>📊 Percentage Calculator</h2>

<input type="number" id="num" placeholder="Enter number">

<input type="number" id="per" placeholder="Enter percentage">

<button id="perBtn">Calculate</button>

<div class="result" id="perResult"></div>
</div>


<!-- BMI -->
<div class="card">
<h2>⚖️ BMI Calculator</h2>

<input type="number" id="weight" placeholder="Weight (kg)">

<input type="number" id="height" placeholder="Height (cm)">

<button id="bmiBtn">Calculate BMI</button>

<div class="result" id="bmiResult"></div>
</div>


<!-- WORD COUNTER -->
<div class="card">
<h2>📝 Word Counter</h2>

<input type="text" id="words" placeholder="Write something">

<button id="wordBtn">Count Words</button>

<div class="result" id="wordResult"></div>
</div>
<!-- UNIT CONVERTER -->
<div class="card">
<h2>🔄 Unit Converter</h2>

<input type="number" id="unitValue" placeholder="Enter value">

<select id="unitType">
<option value="km">Kilometers → Miles</option>
<option value="miles">Miles → Kilometers</option>
<option value="kg">Kilograms → Pounds</option>
<option value="pounds">Pounds → Kilograms</option>
</select>

<button id="unitBtn">Convert</button>

<div class="result" id="unitResult"></div>
</div>
</div>
</div>

<footer>
© 2026 EasyTools
</footer>


<script>

  document.getElementById("unitBtn").onclick = function() {

let value = Number(document.getElementById("unitValue").value);
let type = document.getElementById("unitType").value;
let result = "";

if (isNaN(value)) {
document.getElementById("unitResult").innerHTML =
"Please enter a value.";
return;
}

if (type == "km") {
result = value * 0.621371 + " miles";
}

if (type == "miles") {
result = value * 1.60934 + " kilometers";
}

if (type == "kg") {
result = value * 2.20462 + " pounds";
}

if (type == "pounds") {
result = value * 0.453592 + " kilograms";
}

document.getElementById("unitResult").innerHTML = result;

};

document.getElementById("ageBtn").onclick = function() {

let birth = document.getElementById("birth").value;

if (birth == "") {
document.getElementById("ageResult").innerHTML =
"Please select your birth date.";
return;
}

let birthday = new Date(birth);
let today = new Date();

let age = today.getFullYear() - birthday.getFullYear();

let month = today.getMonth() - birthday.getMonth();

if (month < 0 || 
(month === 0 && today.getDate() < birthday.getDate())) {
age--;
}

document.getElementById("ageResult").innerHTML =
"You are " + age + " years old.";
};


document.getElementById("perBtn").onclick = function() {

let number = Number(document.getElementById("num").value);
let percent = Number(document.getElementById("per").value);

if (isNaN(number) || isNaN(percent)) {
document.getElementById("perResult").innerHTML =
"Please enter both numbers.";
return;
}

let answer = (number * percent) / 100;

document.getElementById("perResult").innerHTML =
percent + "% of " + number + " = " + answer;
};


document.getElementById("bmiBtn").onclick = function() {

let weight = Number(document.getElementById("weight").value);
let height = Number(document.getElementById("height").value);

if (weight <= 0 || height <= 0) {
document.getElementById("bmiResult").innerHTML =
"Please enter valid values.";
return;
}

let meter = height / 100;

let bmi = weight / (meter * meter);

document.getElementById("bmiResult").innerHTML =
"Your BMI is " + bmi.toFixed(1);
};


document.getElementById("wordBtn").onclick = function() {

let text = document.getElementById("words").value.trim();

if (text == "") {
document.getElementById("wordResult").innerHTML =
"Words: 0";
return;
}

let count = text.split(/\s+/).length;

document.getElementById("wordResult").innerHTML =
"Words: " + count;
};

  /* =========================
   EXTRA EASYTOOLS
   ========================= */

const grid = document.querySelector(".grid");

/* DATE CALCULATOR */
const dateCard = document.createElement("div");
dateCard.className = "card";
dateCard.innerHTML = `
<h2>📅 Date Calculator</h2>
<input type="date" id="date1">
<input type="date" id="date2">
<button id="dateBtn">Calculate Days</button>
<div class="result" id="dateResult"></div>
`;
grid.appendChild(dateCard);

document.getElementById("dateBtn").onclick = function() {
    let d1 = document.getElementById("date1").value;
    let d2 = document.getElementById("date2").value;

    if (!d1 || !d2) {
        document.getElementById("dateResult").innerHTML =
        "Please select both dates.";
        return;
    }

    let first = new Date(d1);
    let second = new Date(d2);

    let difference = Math.abs(second - first);
    let days = Math.ceil(difference / (1000 * 60 * 60 * 24));

    document.getElementById("dateResult").innerHTML =
    "Difference: " + days + " days";
};


/* DISCOUNT CALCULATOR */
const discountCard = document.createElement("div");
discountCard.className = "card";
discountCard.innerHTML = `
<h2>💰 Discount Calculator</h2>
<input type="number" id="price" placeholder="Original price">
<input type="number" id="discount" placeholder="Discount %">
<button id="discountBtn">Calculate</button>
<div class="result" id="discountResult"></div>
`;
grid.appendChild(discountCard);

document.getElementById("discountBtn").onclick = function() {
    let price = Number(document.getElementById("price").value);
    let discount = Number(document.getElementById("discount").value);

    if (price <= 0 || discount < 0) {
        document.getElementById("discountResult").innerHTML =
        "Please enter valid values.";
        return;
    }

    let saved = price * discount / 100;
    let finalPrice = price - saved;

    document.getElementById("discountResult").innerHTML =
    "You save: " + saved.toFixed(2) +
    "<br>Final price: " + finalPrice.toFixed(2);
};


/* SIMPLE CALCULATOR */
const calculatorCard = document.createElement("div");
calculatorCard.className = "card";
calculatorCard.innerHTML = `
<h2>🧮 Simple Calculator</h2>
<input type="number" id="calc1" placeholder="First number">
<input type="number" id="calc2" placeholder="Second number">

<select id="operation" style="width:100%;padding:12px;margin:6px 0;border-radius:7px;border:1px solid #ccc;">
<option value="add">Addition (+)</option>
<option value="subtract">Subtraction (-)</option>
<option value="multiply">Multiplication (×)</option>
<option value="divide">Division (÷)</option>
</select>

<button id="calcBtn">Calculate</button>
<div class="result" id="calcResult"></div>
`;
grid.appendChild(calculatorCard);

document.getElementById("calcBtn").onclick = function() {
    let a = Number(document.getElementById("calc1").value);
    let b = Number(document.getElementById("calc2").value);
    let operation = document.getElementById("operation").value;
    let result;

    if (isNaN(a) || isNaN(b)) {
        document.getElementById("calcResult").innerHTML =
        "Please enter both numbers.";
        return;
    }

    if (operation == "add") {
        result = a + b;
    }

    if (operation == "subtract") {
        result = a - b;
    }

    if (operation == "multiply") {
        result = a * b;
    }

    if (operation == "divide") {
        if (b == 0) {
            document.getElementById("calcResult").innerHTML =
            "Cannot divide by zero.";
            return;
        }
        result = a / b;
    }

    document.getElementById("calcResult").innerHTML =
    "Result: " + result;
};


/* NUMBER TO WORDS */
const wordsCard = document.createElement("div");
wordsCard.className = "card";
wordsCard.innerHTML = `
<h2>🔢 Number to Words</h2>
<input type="number" id="numberWords" placeholder="Enter a number">
<button id="numberWordsBtn">Convert</button>
<div class="result" id="numberWordsResult"></div>
`;
grid.appendChild(wordsCard);

function numberToWords(num) {

    const ones = [
        "", "One", "Two", "Three", "Four",
        "Five", "Six", "Seven", "Eight", "Nine",
        "Ten", "Eleven", "Twelve", "Thirteen",
        "Fourteen", "Fifteen", "Sixteen",
        "Seventeen", "Eighteen", "Nineteen"
    ];

    const tens = [
        "", "", "Twenty", "Thirty", "Forty",
        "Fifty", "Sixty", "Seventy", "Eighty", "Ninety"
    ];

    if (num == 0) return "Zero";

    if (num < 20) return ones[num];

    if (num < 100) {
        return tens[Math.floor(num / 10)] +
        (num % 10 ? " " + ones[num % 10] : "");
    }

    if (num < 1000) {
        return ones[Math.floor(num / 100)] +
        " Hundred " +
        numberToWords(num % 100);
    }

    if (num < 1000000) {
        return numberToWords(Math.floor(num / 1000)) +
        " Thousand " +
        numberToWords(num % 1000);
    }

    return "Number too large";
}

document.getElementById("numberWordsBtn").onclick = function() {

    let num = Number(document.getElementById("numberWords").value);

    if (!Number.isInteger(num) || num < 0) {
        document.getElementById("numberWordsResult").innerHTML =
        "Please enter a whole positive number.";
        return;
    }

    document.getElementById("numberWordsResult").innerHTML =
    numberToWords(num);
};


/* TIME CONVERTER */
const timeCard = document.createElement("div");
timeCard.className = "card";
timeCard.innerHTML = `
<h2>⏱️ Time Converter</h2>
<input type="number" id="timeValue" placeholder="Enter value">

<select id="timeType" style="width:100%;padding:12px;margin:6px 0;border-radius:7px;border:1px solid #ccc;">
<option value="hoursMinutes">Hours → Minutes</option>
<option value="minutesHours">Minutes → Hours</option>
<option value="minutesSeconds">Minutes → Seconds</option>
<option value="secondsMinutes">Seconds → Minutes</option>
</select>

<button id="timeBtn">Convert</button>
<div class="result" id="timeResult"></div>
`;
grid.appendChild(timeCard);

document.getElementById("timeBtn").onclick = function() {

    let value = Number(document.getElementById("timeValue").value);
    let type = document.getElementById("timeType").value;
    let result;

    if (isNaN(value) || value < 0) {
        document.getElementById("timeResult").innerHTML =
        "Please enter a valid value.";
        return;
    }

    if (type == "hoursMinutes") {
        result = value * 60 + " minutes";
    }

    if (type == "minutesHours") {
        result = (value / 60).toFixed(2) + " hours";
    }

    if (type == "minutesSeconds") {
        result = value * 60 + " seconds";
    }

    if (type == "secondsMinutes") {
        result = (value / 60).toFixed(2) + " minutes";
    }

    document.getElementById("timeResult").innerHTML =
    result;
};
</script>

</body>
</html>
